<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Neppis</title>
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Reveal the start screen once Inter is in, or after 2 s if it never arrives.
      Promise.race([document.fonts.load('1em "Inter"'), new Promise((r) => setTimeout(r, 2000))])
        .finally(() => document.documentElement.classList.add('fonts-ready'));
    </script>
  </head>
  <body>
    <!-- Boot / title. Painted by the stylesheet before the bundle runs; the tiny script below owns its state. -->
    <div id="boot">
      <div class="boot-inner">
        <!-- The Formula-Neppis silhouette from the side, drawn from a photo of the car: round tail, driver and screen on the
             hump, one long taper to the nose, big wheels. -->
        <svg class="boot-mark" viewBox="0 0 48 24" aria-hidden="true"><path d="M46.2 13.4C46.8 13.8 46.6 14.6 45.8 14.8L43 16.7L7.6 17.7C4.6 17.7 2 15.9 2 12.8C2 9 6.5 6 12.5 6.2C23 6.6 35 9.6 46.2 13.4Z"/><circle cx="14" cy="4.6" r="2.6"/><path d="M17.3 6.8L18.6 3.6L19.9 6.9Z"/><circle cx="11" cy="17.6" r="4.7"/><circle cx="38" cy="18.2" r="4.2"/></svg>
        <div class="boot-word">NEPPIS</div>
        <div class="boot-strap">Finnish flick-car racing</div>
        <div class="boot-progress" role="status" aria-live="polite">
          <div class="boot-bar"><i id="bootBar"></i></div>
          <div class="boot-label" id="bootLabel">Loading</div>
        </div>
        <button type="button" class="btn btn-primary boot-play" id="bootPlay"><span class="if-touch">Tap to play</span><span class="if-fine">Click or press any key</span></button>
        <div class="boot-fail">
          <div class="boot-failmsg" id="bootFail"></div>
          <button type="button" class="btn" id="bootRetry">Retry</button>
        </div>
      </div>
    </div>
    <script>
      // Boot state: the module reports steps through window.__boot; a tap or key anywhere dismisses the ready screen.
      (function () {
        var el = document.getElementById('boot');
        var bar = document.getElementById('bootBar');
        var label = document.getElementById('bootLabel');
        var hold = new URLSearchParams(location.search).get('boot') === 'hold';
        var onGo = null;
        var ready = false;
        function go() {
          if (!ready) return;
          ready = false;
          el.classList.add('is-leaving');
          setTimeout(function () { el.hidden = true; }, 260);
          if (onGo) onGo();
        }
        window.__boot = {
          step: function (name, frac) { label.textContent = name; bar.style.width = Math.round(frac * 100) + '%'; },
          ready: function (cb) { if (hold) return; bar.style.width = '100%'; onGo = cb; ready = true; el.classList.add('is-ready'); },
          fail: function (msg) { el.classList.remove('is-ready'); el.classList.add('is-failed'); document.getElementById('bootFail').textContent = msg; },
          dismiss: function () { el.hidden = true; },
        };
        el.addEventListener('click', go);
        window.addEventListener('keydown', function (e) { if (!e.repeat) go(); });
        document.getElementById('bootRetry').addEventListener('click', function () { location.reload(); });
      })();
    </script>
    <div id="app"></div>
    <div id="hud">
      <div id="players"></div>
      <div id="turn" hidden></div>
      <div id="message"></div>
      <div id="finger" hidden>
        <div class="touch"></div>
        <div class="trail"></div>
        <svg class="hand" viewBox="0 0 40 48" width="40" height="48" aria-hidden="true">
          <path d="M14 26 V8 a4 4 0 0 1 8 0 v14 l2-1 a3.5 3.5 0 0 1 5 2 l1.5-0.5 a3.5 3.5 0 0 1 5 2.5 l1.5-0.3 a3 3 0 0 1 3.5 3 v9 c0 6-4 11-11 11 h-5 c-4 0-7-2-9-5 l-7-10 a3.5 3.5 0 0 1 5.5-4.5 z" fill="#fff" stroke="#1d2430" stroke-width="2.2" stroke-linejoin="round"/>
        </svg>
      </div>
      <button id="newRace" type="button" class="btn">New race</button>
    </div>
    <div id="setup">
      <form id="setupForm" class="card">
        <h1>Neppis</h1>
        <p class="sub">Finnish flick-car racing. Three flicks per turn. Stay on the track, keep the rubber side down.</p>
        <div class="setup-grid">
          <div id="playerRows"></div>
          <div class="setup-side">
            <button type="button" id="addPlayer" class="btn btn-block">+ Add player</button>
            <div class="strip"><span>Laps</span><span class="stepper"><button type="button" id="lapsMinus" class="btn btn-icon" aria-label="Fewer laps"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span id="lapsValue" class="value num">1</span><button type="button" id="lapsPlus" class="btn btn-icon" aria-label="More laps"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></span></div>
            <input type="hidden" id="laps" value="1" />
            <button type="submit" id="start" class="btn btn-primary btn-block">Start race</button>
          </div>
        </div>
      </form>
    </div>
    <div id="results" hidden></div>
    <div id="kit" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
